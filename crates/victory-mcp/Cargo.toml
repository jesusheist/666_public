[package]
name = "victory-mcp"
description = "A debug MCP server inside the runtime: off unless VICTORY_MCP=<port>, loopback only, read-only tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
zlib-rs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
